<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#FAF8F5;--cd:#fff;--tx:#1f2a24;--mu:#6b7a72;--ac:#1B4332;--a2:#dcebe1;--bd:#e3e0d8;--bad:#b91c1c;--on:#FAF8F5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121a16;--cd:#1a2420;--tx:#ecefe9;--mu:#9baba1;--ac:#9BC1A8;--a2:#26382e;--bd:#2c3a33;--bad:#f87171;--on:#10201a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121a16;--cd:#1a2420;--tx:#ecefe9;--mu:#9baba1;--ac:#9BC1A8;--a2:#26382e;--bd:#2c3a33;--bad:#f87171;--on:#10201a}

.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}label.cb{display:flex;gap:8px;font-size:14px;color:var(--tx);align-items:flex-start}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}input[type=checkbox]{width:auto;margin-top:3px}
button,.btn{display:block;width:100%;margin-top:8px;padding:10px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}

.row,.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.chip{border:1px solid var(--bd);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.tg{border:1px solid var(--bd);border-radius:99px;padding:2px 9px;font-size:12px}.tags{margin:8px 0}
.top{display:flex;justify-content:space-between;gap:8px}.pc{font-weight:700;color:var(--ac)}.lk{color:var(--ac);cursor:pointer;font-weight:600}
.pr{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--a2);color:var(--ac);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}

.ban{height:130px;border-radius:10px;background:var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px;margin-bottom:8px;overflow:hidden}.ban img{width:100%;height:100%;object-fit:cover}
.gal{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px}.gal img{height:190px;width:85%;flex:none;object-fit:cover;border-radius:10px}.th{width:72px;height:72px;object-fit:cover;border-radius:8px;margin-top:6px}
.msgs{display:flex;flex-direction:column;gap:6px;margin:10px 0}.m{max-width:80%;padding:8px 11px;border-radius:14px;border:1px solid var(--bd);background:var(--cd)}.m.me{align-self:flex-end;background:var(--ac);color:var(--on);border-color:var(--ac)}

</style></head><body>

<script>
/* ===== 1. PASTE YOUR TWO SUPABASE VALUES HERE (Project Settings > API). Use the public anon key, never the service_role key. ===== */
const CFG={url:'https://xokkilgphezineqxjdzt.supabase.co',key:'sb_publishable_0LdBkffgJegXJlI0gbxSpw_FXbxF8co'};

const {useState,useEffect,useCallback,useRef}=React,h=htm.bind(React.createElement);
const sb=supabase.createClient(CFG.url,CFG.key);
const $=s=>document.querySelector(s),inr=n=>'₹'+Number(n||0).toLocaleString('en-IN'),r2=n=>Math.round(n*100)/100,fst=n=>String(n||'').split(' ')[0];
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3200)};
const run=async(p,ok)=>{const{data,error}=await p;if(error){toast(error.message);return null}if(ok)toast(ok);return data??true};
const pub=p=>sb.storage.from('listing-photos').getPublicUrl(p).data.publicUrl;
const shrink=(f,max=900)=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.72)};im.onerror=rej;im.src=URL.createObjectURL(f)});
const Y3=[['yes','Yes'],['no','No'],['pns','Prefer not to say']],Y2=[['yes','Yes'],['no','No']];
const Q=[
['sleep','Sleep','Are you a night owl or an early riser?',[['early','Early riser'],['late','Night owl'],['flex','Flexible']]],
['routine','Day','What does your day look like?',[['wfh','Work from home'],['office','Go to office'],['college','Attend college'],['hybrid','Hybrid']]],
['noise','Home vibe','Quiet house, or music and TV on?',[['quiet','Quiet'],['some','Some music or TV'],['loud','Music or TV often']]],
['gatherings','Gatherings','Comfortable with gatherings at home?',[['none','Prefer none'],['small','Small gatherings'],['parties','Parties are fine']]],
['guests','Guests','How often do you have guests over?',[['rare','Rarely'],['some','Sometimes'],['often','Often']]],
['has_pets','Has pets','Do you have pets?',Y3],['ok_pets','OK with pets','Comfortable living with pets?',Y2],
['smoke','Smokes','Do you smoke?',Y3],['drink','Drinks','Do you drink alcohol?',Y3],
['smoke_ok','OK with smoking','OK with a flatmate who smokes?',Y3],['drink_ok','OK with drinking','OK with a flatmate who drinks?',Y3],
['food','Food','Are you veg or non-veg?',[['veg','Vegetarian'],['egg','Eggetarian'],['nonveg','Non-vegetarian']]],
['nonveg_home','Non-veg at home','OK with non-veg cooked at home?',Y2],
['cooking','Cooks','How often do you cook?',[['daily','Daily'],['some','Sometimes'],['rare','Rarely']]],
['clean','Tidiness','How tidy are you? (1 relaxed, 5 spotless)',[1,2,3,4,5].map(x=>[String(x),x+'/5'])],
['chores','Chores','How should chores be handled?',[['share','Share equally'],['rota','Weekly rota'],['help','Hired help']]],
['stay','Stay','How long do you plan to stay?',[['short','Under 6 months'],['long','6 months or more']]]];
const KEYS=Q.map(q=>q[0]),KINDS=[['room','Room'],['1bhk','1 BHK'],['2bhk','2 BHK'],['3bhk','3 BHK'],['house','House']];
const CATS=[['rent','Rent'],['groceries','Groceries'],['electricity','Electricity'],['wifi','Wi-Fi'],['water','Water'],['gas','Gas'],['food','Food'],['travel','Travel'],['other','Other']];
const N={quiet:0,some:1,loud:2,none:0,small:1,parties:2,rare:0,often:2};
function score(m,c){const r=[],w=[],add=(x,v,t)=>{w.push([x,v]);if(t&&v>=.85)r.push(t)};
const near=k=>1-Math.abs((N[m[k]]??1)-(N[c[k]]??1))/2,clash=(d,o)=>d=='yes'&&o=='no'?0:d=='pns'||o=='pns'?.7:1,fc=(a,b)=>a.food=='veg'&&a.nonveg_home=='no'&&b.food!='veg'?.2:1;
const ov=Math.min(m.bmax,c.bmax)-Math.max(m.bmin,c.bmin);
add(20,Math.max(0,Math.min(1,(ov+1000)/3000)),'Rent budgets overlap');add(12,m.sleep==c.sleep?1:m.sleep=='flex'||c.sleep=='flex'?.7:.2,'Same sleep routine');add(3,m.routine==c.routine?1:.7);
add(10,near('noise'),'Similar noise preference');add(8,near('gatherings'),'Same view on gatherings');add(4,near('guests'));add(12,1-Math.abs(m.clean-c.clean)/4,'Similar tidiness');
add(10,Math.min(clash(c.smoke,m.smoke_ok),clash(m.smoke,c.smoke_ok)),'Smoking preferences fit');add(6,Math.min(clash(c.drink,m.drink_ok),clash(m.drink,c.drink_ok)),'Drinking preferences fit');
add(6,Math.min(clash(c.has_pets,m.ok_pets),clash(m.has_pets,c.ok_pets)),'Pets are fine for both');const f=Math.min(fc(m,c),fc(c,m));add(8,f<1?f:m.food==c.food?1:.8,'Food habits fit');
add(4,m.room==c.room?1:.3);add(3,m.stay==c.stay?1:.5);add(3,m.chores==c.chores?1:.6);
return{s:Math.round(w.reduce((a,[x,v])=>a+x*v,0)*100/w.reduce((a,[x])=>a+x,0)),r}}

/* ---------- small UI pieces ---------- */
const Inp=({l,v,set,t='text',ph,max})=>h`<label>${l}</label><input type=${t} value=${v??''} placeholder=${ph} maxLength=${max} onChange=${e=>set(e.target.value)}/>`;
const Ch=({l,v,set,o})=>h`<label>${l}</label><div className="row">${o.map(([k,t])=>h`<span key=${k} className=${'chip'+(v==k?' on':'')} onClick=${()=>set(k)}>${t}</span>`)}</div>`;
const Back=({f})=>h`<p><span className="lk" onClick=${f}>‹ Back</span></p>`;
function Av({path,name}){const[u,setU]=useState(null);useEffect(()=>{let on=1;if(path)sb.storage.from('profile-photos').createSignedUrl(path,3600).then(({data})=>on&&setU(data?.signedUrl||null));return()=>{on=0}},[path]);
return u?h`<img className="av" src=${u} alt=""/>`:h`<span className="av">${(name||'?')[0].toUpperCase()}</span>`}
function Prof({p,name,s,r}){const g={f:'Woman',m:'Man',o:'Other'}[p.gender];
return h`<div><div className="pr"><${Av} path=${p.photo_path} name=${name}/><div style=${{flex:1}}><div className="top"><b>${name}</b>${s!=null&&h`<span className="pc">${s}%</span>`}</div><div className="mu">${[p.age&&p.age+' yrs',g,p.role].filter(Boolean).join(' · ')}</div></div></div>
${p.area&&h`<div className="mu">Looking in ${p.area}</div>`}${p.bio&&h`<p>${p.bio}</p>`}
<div className="mu">Budget ${inr(p.bmin)}–${inr(p.bmax)}${p.move_in?' · Move-in '+p.move_in:''} · ${p.room=='private'?'Wants a private room':'Fine sharing a room'}</div>
<div className="tags">${Q.map(q=>{const o=q[3].find(x=>x[0]==p[q[0]]);return o&&h`<span key=${q[0]} className="tg">${q[1]}: ${o[1]}</span>`})}</div>${r&&r.length>0&&h`<p className="mu">Why you match: ${r.join(' · ')}</p>`}</div>`}

/* ---------- sign in / sign up ---------- */
function Auth(){const[m,setM]=useState('in'),[e,setE]=useState(''),[p,setP]=useState(''),[p2,setP2]=useState(''),[bz,setBz]=useState(false);
const go=async()=>{if(!/^\S+@\S+\.\S+$/.test(e))return toast('Enter a valid email');if(p.length<8)return toast('Password must be at least 8 characters');if(m=='up'&&p!=p2)return toast('Passwords do not match');
setBz(true);const c={email:e.trim().toLowerCase(),password:p};
if(m=='up'){const{data,error}=await sb.auth.signUp(c);if(error)toast(error.message);else if(!data.session){toast('Check your email to confirm, then sign in');setM('in')}}
else{const{error}=await sb.auth.signInWithPassword(c);if(error)toast(error.message=='Invalid login credentials'?'Wrong email or password':error.message)}setBz(false)};
return h`<main><h2>🏠 FlatMatch</h2><p className="mu">Find flatmates who fit your lifestyle.</p><div className="card"><b>${m=='up'?'Create your account':'Sign in'}</b>
<${Inp} l="Email" v=${e} set=${setE} t="email"/><${Inp} l="Password (at least 8 characters)" v=${p} set=${setP} t="password"/>${m=='up'&&h`<${Inp} l="Confirm password" v=${p2} set=${setP2} t="password"/>`}
<button disabled=${bz} onClick=${go}>${bz?'Please wait…':m=='up'?'Create account':'Sign in'}</button><button className="g" onClick=${()=>setM(m=='up'?'in':'up')}>${m=='up'?'I already have an account':'New here? Create an account'}</button></div></main>`}

/* ---------- profile form (create + edit) ---------- */
function Form({me,user,done,cancel}){const[f,setF]=useState(()=>({gpref:'any',room:'private',bmin:6000,bmax:12000,...(me||{})})),[ad,setAd]=useState(!!me),[tm,setTm]=useState(!!me),[ph,setPh]=useState(null),[pu,setPu]=useState(null);
const s=k=>v=>setF(x=>({...x,[k]:v}));
const pick=async e=>{const fl=e.target.files[0];if(!fl)return;try{const b=await shrink(fl,500);setPh(b);setPu(URL.createObjectURL(b))}catch(x){toast('Could not read that image')}};
const save=async()=>{for(const k of['name','age','gender','city',...KEYS])if(!f[k])return toast('Please fill: '+(Q.find(q=>q[0]==k)?.[1]||k));
if(+f.age<18)return toast('You must be 18 or older');if(!ad||!tm)return toast('Please confirm your age and accept the Terms');
let photo_path=f.photo_path||null;if(ph){const path=user.id+'/avatar.jpg';if(!await run(sb.storage.from('profile-photos').upload(path,ph,{contentType:'image/jpeg',upsert:true})))return;photo_path=path}
const row={id:user.id,name:f.name.trim(),age:+f.age,gender:f.gender,role:f.role||null,bio:f.bio||null,city:f.city.trim(),gpref:f.gpref,bmin:+f.bmin,bmax:+f.bmax,move_in:f.move_in||null,room:f.room,photo_path,is_adult:true,accepted_terms_at:me?.accepted_terms_at||new Date().toISOString()};
KEYS.forEach(k=>row[k]=k=='clean'?+f[k]:f[k]);if(await run(sb.from('profiles').upsert(row),'Profile saved'))done()};
return h`<main><h2>${me?'Edit your profile':'About you'}</h2><p className="mu">Others searching your area see your first name, intro and these answers. Your photo and full name appear only after you connect.</p>
<div className="card"><div className="pr"><${pu?'img':Av} ...${pu?{className:'av',src:pu}:{path:f.photo_path,name:f.name}}/><label className="btn g" style=${{margin:0}}>${f.photo_path||pu?'Change photo':'Upload profile photo'}<input type="file" accept="image/*" hidden onChange=${pick}/></label></div>
<${Inp} l="Full name" v=${f.name} set=${s('name')}/><${Inp} l="Age" v=${f.age} set=${s('age')} t="number"/><${Ch} l="I am" v=${f.gender} set=${s('gender')} o=${[['f','Woman'],['m','Man'],['o','Other']]}/>
<${Inp} l="What do you do? (optional)" v=${f.role} set=${s('role')} ph="Software engineer, CA student…"/><${Inp} l="Short intro (max 200 characters)" v=${f.bio} set=${s('bio')} max=${200}/>
<${Inp} l="Your home city" v=${f.city} set=${s('city')}/><${Ch} l="Flatmate preference" v=${f.gpref} set=${s('gpref')} o=${[['any','Anyone'],['women','Women only'],['men','Men only']]}/></div>
<div className="card"><${Inp} l="Rent min (₹/month)" v=${f.bmin} set=${s('bmin')} t="number"/><${Inp} l="Rent max (₹/month)" v=${f.bmax} set=${s('bmax')} t="number"/><${Inp} l="Move-in date (optional)" v=${f.move_in} set=${s('move_in')} t="date"/><${Ch} l="Room" v=${f.room} set=${s('room')} o=${[['private','Private room'],['sharing','Sharing is fine']]}/></div>
<div className="card"><b>Lifestyle</b>${Q.map(q=>h`<${Ch} key=${q[0]} l=${q[2]} v=${f[q[0]]} set=${s(q[0])} o=${q[3]}/>`)}</div>
<div className="card">${!me&&h`<label className="cb"><input type="checkbox" checked=${ad} onChange=${e=>setAd(e.target.checked)}/> I am 18 or older.</label><label className="cb"><input type="checkbox" checked=${tm} onChange=${e=>setTm(e.target.checked)}/> I accept the Terms and Privacy Policy and agree my first name, intro and answers are shown to people searching the same area.</label>`}
<button onClick=${save}>${me?'Save changes':'Save and continue'}</button>${cancel&&h`<button className="g" onClick=${cancel}>Cancel</button>`}</div></main>`}

/* ---------- People ---------- */
function People({me,user,setView}){const[areas,setAreas]=useState([]),[sel,setSel]=useState(null),[rows,setRows]=useState([]),[st,setSt]=useState({}),[city,setCity]=useState(''),[loc,setLoc]=useState('');
const load=useCallback(async pick=>{if(!me)return;const{data:ar}=await sb.from('area_searches').select('id,city,locality').gt('expires_at',new Date().toISOString()).order('created_at');
const list=ar||[];setAreas(list);const cur=list.find(a=>a.id==(pick||sel))||list[0];setSel(cur?.id||null);if(!cur)return setRows([]);
const[{data:f},{data:cs}]=await Promise.all([sb.rpc('discover_profiles',{p_city:cur.city,p_locality:cur.locality}),sb.from('connections').select('id,from_id,to_id,status')]);
const by={};(cs||[]).forEach(c=>by[c.from_id==user.id?c.to_id:c.from_id]=c);setSt(by);const want=me.gpref=='women'?'f':me.gpref=='men'?'m':null;
setRows((f||[]).filter(p=>(!want||p.gender==want)&&!(by[p.id]?.to_id==user.id&&by[p.id]?.status=='requested')).map(p=>({p,...score(me,p)})).sort((a,b)=>b.s-a.s))},[me,sel,user.id]);
useEffect(()=>{load()},[load]);
if(!me)return h`<main><h2>Find flatmates</h2><p className="mu">People you connect with see your profile and answers, so please create it first. Split expenses and Flats work without it.</p><button onClick=${()=>setView({t:'edit'})}>Create my profile</button></main>`;
const add=async()=>{if(!city.trim())return toast('Enter a city');const id=await run(sb.rpc('join_area',{p_city:city,p_locality:loc}),'You are now visible to people searching there');if(id){setCity('');setLoc('');load(id===true?null:id)}};
const lab=a=>(a.locality?a.locality+', ':'')+a.city;const cur=areas.find(a=>a.id==sel);
return h`<main><h2>Where are you looking?</h2><p className="mu">Add up to 3 areas. Your profile is shown only to others searching the same area.</p>
<div className="row">${areas.map(a=>h`<span key=${a.id} className=${'chip'+(sel==a.id?' on':'')}><span onClick=${()=>setSel(a.id)}>${lab(a)}</span> <span onClick=${async()=>{await sb.from('area_searches').delete().eq('id',a.id);load()}}>✕</span></span>`)}</div>
<${Inp} l="City" v=${city} set=${setCity} ph="e.g. Dehradun"/><${Inp} l="Area (optional)" v=${loc} set=${setLoc} ph="e.g. Rajpur Road"/><button onClick=${add}>Search this area and show my profile</button>
${areas.length>0&&h`<button className="g" onClick=${async()=>{await sb.from('area_searches').delete().eq('user_id',user.id);toast('You are hidden from everyone');load()}}>Hide my profile from everyone</button>`}
<button className="g" onClick=${()=>setView({t:'edit'})}>Edit my profile</button>
<p className="mu" style=${{marginTop:12}}>${cur?'People also searching '+lab(cur)+':':'Add an area to see people searching there.'}</p>${cur&&!rows.length&&h`<p className="mu">No one else is searching here yet. You are visible to new people as they join.</p>`}
${rows.map(({p,s,r})=>{const c=st[p.id],full=c?.status=='accepted';return h`<div className="card" key=${p.id}><${Prof} p=${p} name=${p.first_name} s=${s} r=${r}/>
${!c&&h`<button onClick=${async()=>{const d=await run(sb.rpc('show_interest',{target:p.id}));if(d==='accepted')toast('It’s a match! Open Inbox to chat.');else if(d)toast('Interest sent');load()}}>Show interest</button>`}
${c?.status=='requested'&&h`<p className="mu">Interest sent. Waiting for their reply.</p>`}${full&&h`<button onClick=${()=>setView({t:'chat',id:c.id,name:p.first_name})}>Open chat</button>`}
<button className="g" style=${{width:'auto'}} onClick=${async()=>{await sb.from('reports').insert({reporter:user.id,reported:p.id,reason:'Reported from area card'});await sb.from('blocks').insert({blocker:user.id,blocked:p.id});load()}}>Report and block</button></div>`})}</main>`}

/* ---------- Inbox ---------- */
function Inbox({me,user,setView}){const[req,setReq]=useState([]),[chats,setChats]=useState([]),[inq,setInq]=useState([]);
const load=useCallback(async()=>{const{data:cs}=await sb.from('connections').select('id,from_id,to_id,status').in('status',['requested','accepted']);
const want=(cs||[]).filter(c=>c.status=='accepted'||c.to_id==user.id),oth=c=>c.from_id==user.id?c.to_id:c.from_id;

<${Inp} l="Add someone by name" v=${mn} set=${setMn} ph="Riya"/><${Inp} l="Phone or email (optional, visible to the group)" v=${mc} set=${setMc}/><button className="g" onClick=${()=>mn.trim()?addM({p_group:gid,p_name:mn.trim(),p_contact:mc.trim()||null,p_user:null}):toast('Enter a name')}>Add person</button>
${cts.filter(c=>!ms.some(x=>x.user_id==c.id)).length>0&&h`<label>Or pick from your FlatMatch contacts</label><div className="row">${cts.filter(c=>!ms.some(x=>x.user_id==c.id)).map(c=>h`<span key=${c.id} className="chip" onClick=${()=>addM({p_group:gid,p_name:c.name,p_contact:null,p_user:c.id})}>+ ${c.name}</span>`)}</div><p className="mu">People added from contacts can also see this group.</p>`}</div>
<div className="card"><b>History</b>${!ex.length&&h`<p className="mu">No expenses yet.</p>`}${ex.map(e=>h`<div key=${e.id} style=${{marginTop:8}}><div className="top"><b>${e.kind=='settlement'?nmOf(e.paid_by)+' paid '+nmOf(e.settle_to):e.title}</b><b>${inr(e.amount)}</b></div><div className="mu">${e.kind=='expense'?(CATS.find(c=>c[0]==e.category)?.[1]||'Other')+' · '+nmOf(e.paid_by)+' paid · ':'Settlement · '}${new Date(e.created_at).toLocaleDateString()}</div>
${e.created_by==user.id&&h`<span className="mu" style=${{cursor:'pointer'}} onClick=${async()=>{const{data}=await sb.from('split_expenses').delete().eq('id',e.id).select('id');if(!data?.length)toast('Only the person who added this entry can delete it.');load()}}>Delete entry</span>`}</div>`)}</div>
${g?.created_by==user.id&&h`<button className="d" onClick=${async()=>{if(!confirm('Delete this group and all its expenses for everyone?'))return;const{data}=await sb.from('split_groups').delete().eq('id',gid).select('id');if(data?.length)back();else toast('Only the creator can delete the group.')}}>Delete this group</button>`}</main>`}

/* ---------- Safety / account ---------- */
function More({user,setView}){return h`<main><h2>Safety and account</h2><div className="card"><b>First-meeting safety</b><ul className="mu"><li>Meet in a public place, in daytime.</li><li>Tell a friend where you are going.</li><li>See the flat and read the agreement before paying.</li><li>Never send advance money to someone you haven’t met.</li><li>Check the landlord allows sharing; follow local police verification rules.</li></ul><p className="mu">Emergency: Police 112 · Women helpline 181</p></div>
<div className="card"><b>Grievance Officer</b><p className="mu">[Name], [email], [phone]. Fill in before launch.</p></div>
<button onClick=${()=>setView({t:'edit'})}>Edit my profile</button><button className="g" onClick=${()=>sb.auth.signOut()}>Sign out</button>
<button className="d" onClick=${async()=>{if(!confirm('Delete all your data, photos and profile? This cannot be undone.'))return;for(const b of['profile-photos','listing-photos']){const{data}=await sb.storage.from(b).list(user.id);if(data?.length)await sb.storage.from(b).remove(data.map(f=>user.id+'/'+f.name))}await sb.rpc('delete_my_data');await sb.auth.signOut()}}>Delete all my data</button></main>`}

/* ---------- app shell ---------- */
function Main({user}){const[me,setMe]=useState(undefined),[tab,setTab]=useState('ppl'),[view,setView]=useState(null);
const loadMe=useCallback(async()=>{const{data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();setMe(data?.accepted_terms_at?data:null)},[user.id]);useEffect(()=>{loadMe()},[loadMe]);
if(me===undefined)return h`<main>Loading…</main>`;
const need=why=>{if(me)return true;toast(why);setView({t:'edit'});return false},back=()=>setView(null);
let body;if(view?.t=='edit')body=h`<${Form} me=${me} user=${user} done=${()=>{loadMe();setView(null)}} cancel=${me?back:null}/>`;
else if(view?.t=='chat')body=h`<${Chat} v=${view} user=${user} back=${back}/>`;else if(view?.t=='lst')body=h`<${Listing} id=${view.id} user=${user} need=${need} back=${back} setView=${setView}/>`;else if(view?.t=='post')body=h`<${Post} user=${user} need=${need} back=${back} setView=${setView}/>`;
else body={ppl:h`<${People} me=${me} user=${user} setView=${setView}/>`,inb:h`<${Inbox} me=${me} user=${user} setView=${setView}/>`,flt:h`<${Flats} setView=${setView}/>`,spl:h`<${Split} user=${user} me=${me}/>`,more:h`<${More} user=${user} setView=${setView}/>`}[tab];
return h`<div>${body}<nav>${[['ppl','People'],['inb','Inbox'],['flt','Flats'],['spl','Split'],['more','Safety']].map(([k,t])=>h`<span key=${k} className=${tab==k&&!view?'on':''} onClick=${()=>{setTab(k);setView(null)}}>${t}</span>`)}</nav></div>`}
function App(){const[s,setS]=useState(undefined);useEffect(()=>{sb.auth.getSession().then(({data})=>setS(data.session));const{data}=sb.auth.onAuthStateChange((_e,x)=>setS(x));return()=>data.subscription.unsubscribe()},[]);
if(CFG.url.includes('YOUR-PROJECT'))return h`<main><h2>Almost there</h2><p>Open <b>index.html</b> in a text editor and paste your Supabase project URL and anon key into the <b>CFG</b> line near the top of the script.</p></main>`;
if(s===undefined)return h`<main>Loading…</main>`;return s?h`<${Main} user=${s.user} key=${s.user.id}/>`:h`<${Auth}/>`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script></body></html>
